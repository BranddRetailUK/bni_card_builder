<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BNI Card Builder</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dhlqooyuk/image/upload/v1777444596/bni_fav_lbijbm.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip-link" href="#builder">Skip to content</a>

    <header class="site-header" aria-label="BNI Products header">
      <div class="site-red-bar" aria-hidden="true"></div>
      <div class="site-header-inner">
        <button class="mobile-menu-button" type="button" aria-label="Menu">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        </button>

        <a class="site-logo" href="#" aria-label="BNI Products home">
          <img src="https://res.cloudinary.com/dhlqooyuk/image/upload/v1777444596/bni_fav_lbijbm.png" alt="BNI Products">
        </a>

        <nav class="site-nav" aria-label="Main navigation">
          <a href="#">Chapter Accessories</a>
          <a href="#">Member Accessories</a>
          <a href="#">Referral Generators</a>
          <a href="#">Merchandise</a>
        </nav>

        <div class="header-actions" aria-label="Store actions">
          <a class="icon-link" href="#" aria-label="Search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m21 21-4.2-4.2"></path>
              <circle cx="11" cy="11" r="7"></circle>
            </svg>
          </a>
          <a class="icon-link" href="#" aria-label="Account">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21c1.7-4 4.4-6 8-6s6.3 2 8 6"></path>
            </svg>
          </a>
          <a class="cart-link" href="#" aria-label="Cart">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 8h12l-1 12H7L6 8Z"></path>
              <path d="M9 8a3 3 0 0 1 6 0"></path>
            </svg>
            <span>0</span>
          </a>
        </div>
      </div>
    </header>

    <main class="builder-shell" id="builder">
      <header class="builder-header">
        <p class="builder-kicker">BNI Products</p>
        <h1>BNI Card Builder</h1>
      </header>

      <section class="builder-grid" aria-label="Card editor">
        <section class="preview-panel" aria-labelledby="preview-title">
          <div class="panel-heading">
            <h2 id="preview-title">Preview</h2>
            <span>85 x 55 mm</span>
          </div>

          <div class="preview-stage">
            <canvas id="cardCanvas" aria-label="Live card preview"></canvas>
          </div>
        </section>

        <form class="control-panel" aria-label="Card details">
          <div class="field-group">
            <label for="nameInput">Name</label>
            <input id="nameInput" name="name" type="text" value="First Last Name" autocomplete="name" maxlength="80">
          </div>

          <div class="field-group">
            <label for="roleInput">Job role</label>
            <input id="roleInput" name="role" type="text" value="Job Title" maxlength="80">
          </div>

          <div class="field-group">
            <label for="thirdInput">Third text</label>
            <input id="thirdInput" name="thirdText" type="text" value="Third Text Line" maxlength="80">
          </div>

          <fieldset class="colour-field">
            <legend>Colour</legend>
            <div class="swatch-row" aria-label="Base colour">
              <button class="swatch-button is-active" type="button" data-colour="red" aria-pressed="true">
                <span class="swatch swatch-red" aria-hidden="true"></span>
                <span>Red</span>
              </button>
              <button class="swatch-button" type="button" data-colour="green" aria-pressed="false">
                <span class="swatch swatch-green" aria-hidden="true"></span>
                <span>Green</span>
              </button>
              <button class="swatch-button" type="button" data-colour="blue" aria-pressed="false">
                <span class="swatch swatch-blue" aria-hidden="true"></span>
                <span>Blue</span>
              </button>
            </div>
          </fieldset>

          <button class="download-button" id="downloadButton" type="button">Download PDF</button>
        </form>
      </section>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
